<body class="bg-gray-100 font-[Caveat_Brush]">
  <main class="max-w-7xl mx-auto">

    <h1 class="text-3xl text-center my-6">Meal Explorer</h1>

    <form id="searchForm" class="flex justify-center gap-2 mb-6">
      <label for="areaInput" class="sr-only">Cuisine</label>
      <input
        id="areaInput"
        type="text"
        placeholder="Enter cuisine (e.g. Chinese)"
        class="p-2 rounded border"
      />
      <button class="bg-black text-white px-4 py-2 rounded">
        Search
      </button>
    </form>

    <section
      id="meals"
      class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4 px-4"
    ></section>

  </main>

  <script src="src/index.js"></script>
</body>
